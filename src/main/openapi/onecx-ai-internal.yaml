---
openapi: 3.0.3
info:
  title: onecx-ai-provider internal service
  version: 1.0.0
servers:
  - url: "http://onecx-ai-provider-svc:8080"
tags:
  - name: providerInternal
  - name: agentInternal
  - name: toolInternal
  - name: modelInternal
  - name: scaffoldInternal
  - name: skillInternal
  - name: agentGroupInternal
  - name: externalAgentInternal
  - name: dangerPatternInternal
  - name: dispatchInternal
paths:
  /internal/dispatch/chat:
    post:
      security:
        - oauth2: [ ocx-ai:all, ocx-ai:read ]
      tags:
        - dispatchInternal
      summary: Chat with AI
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: No agent found for the given request context (AGENT_NOT_FOUND). Not retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "502":
          description: The agent runtime failed or returned an invalid response (RUNTIME_ERROR, RUNTIME_INVALID_RESPONSE). Not retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "503":
          description: The agent runtime is not reachable (RUNTIME_UNAVAILABLE). Transient, retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "504":
          description: The agent runtime timed out (RUNTIME_TIMEOUT). Transient, retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'

  /internal/agents:
    post:
      security:
        - oauth2: [ ocx-ai:all, ocx-ai:write ]
      tags:
        - agentInternal
      description: Create an Agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        "201":
          description: Agent created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'

  /internal/agents/{id}:
    get:
      security:
        - oauth2: [ ocx-ai:all, ocx-ai:read ]
      tags:
        - agentInternal
      description: Get Agent
      operationId: getAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        "404":
          description: Not found
    delete:
      security:
        - oauth2: [ ocx-ai:all, ocx-ai:delete ]
      tags:
        - agentInternal
      description: Delete Agent
      operationId: deleteAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Agent deleted
    put:
      security:
        - oauth2: [ ocx-ai:all, ocx-ai:write ]
      tags:
        - agentInternal
      description: Update an Agent
      operationId: updateAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        "200":
          description: Agent updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: Agent not found

  /internal/agents/{id}/configuration/versions:
    post:
      security:
        - oauth2: [ ocx-ai:all, ocx-ai:write ]
      tags:
        - agentInternal
      operationId: createAgentConfigurationVersion
      description: Save an immutable version of the currently resolved configuration with a stable unique identifier and a name unique to this agent and tenant. Names are trimmed and case-sensitive. Agents have no active version until the first POST or active-configuration GET. Only the first version becomes active automatically; later versions require explicit activation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentConfigurationVersion'
      responses:
        "201":
          description: Immutable version created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigurationVersion'
        "400":
          description: Invalid name, duplicate version name (DUPLICATE_AGENT_CONFIGURATION_VERSION_NAME), duplicate MCP tool rules (DUPLICATE_AGENT_TOOL_RULE), or invalid configuration dependencies (INVALID_AGENT_CONFIGURATION_DEPENDENCIES)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: Agent not found
  /internal/agents/{id}/configuration/versions/{versionId}:
    get:
      security:
        - oauth2: [ ocx-ai:all, ocx-ai:read ]
      tags:
        - agentInternal
      operationId: getAgentConfigurationVersion
      description: Get the saved configuration by its stable identifier, independent of the active version.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema:
                $ref: './onecx-ai-v1.yaml#/components/schemas/AgentConfiguration'
        "404":
          description: Agent or version not found
  /internal/agents/{id}/configuration/versions/{versionId}/activate:
    put:
      security:
        - oauth2: [ ocx-ai:all, ocx-ai:write ]
      tags:
        - agentInternal
      operationId: activateAgentConfigurationVersion
      description: >-
        Make a saved version active without changing its identifier or content.
        Reject activation if referenced models, providers, MCP tools or required credentials
        are missing or incompatible.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Version activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigurationVersion'
        "400":
          description: Invalid configuration dependencies (INVALID_AGENT_CONFIGURATION_DEPENDENCIES)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: Agent or version not found
  /internal/agents/search:
    post:
      security:
        - oauth2: [ ocx-ai:all, ocx-ai:read ]
      tags:
        - agentInternal
      description: Find Agent by Search Criteria
      operationId: findAgentBySearchCriteria
