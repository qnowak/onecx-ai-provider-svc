      required:
        - chatMessage
      properties:
        requestContext:
          $ref: '#/components/schemas/RequestContext'
        chatMessage:
          $ref: '#/components/schemas/ChatMessage'
        conversation:
          $ref: '#/components/schemas/Conversation'
    RequestContext:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/AgentFilter'
        agentId:
          type: string
        aiContext:
          type: array
          items:
            type: string
    ChatMessage:
      type: object
      properties:
        conversationId:
          type: string
        message:
          type: string
          maxLength: 10000
        type:
          type: string
          enum: [ ASSISTANT, SYSTEM, USER, ACTION ]
        creationDate:
          type: integer
          format: int64
