---
openapi: 3.0.3
info:
  title: onecx-ai-provider external v1 service
  version: 1.0.0
servers:
  - url: "http://onecx-ai-provider-svc:8080"
tags:
  - name: dispatch
  - name: agent
paths:
  /v1/dispatch/chat:
    post:
      security:
        - oauth2: [ ocx-ai:read ]
      tags:
        - dispatch
      summary: Chat with AI
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailResponse"
        "404":
          description: No agent found for the given request context (AGENT_NOT_FOUND). Not retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailResponse"
        "502":
          description: The agent runtime failed or returned an invalid response (RUNTIME_ERROR, RUNTIME_INVALID_RESPONSE). Not retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailResponse"
        "503":
          description: The agent runtime is not reachable (RUNTIME_UNAVAILABLE). Transient, retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailResponse"
        "504":
          description: The agent runtime timed out (RUNTIME_TIMEOUT). Transient, retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailResponse"

  /v1/agents/search:
    post:
      security:
        - oauth2: [ ocx-ai:read ]
      tags:
        - agent
      description: Find Agent by Search Criteria
      operationId: findAgentBySearchCriteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSearchCriteria"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPageResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailResponse"
  /v1/agents/{id}/configuration:
    get:
      security:
        - oauth2: [ ocx-ai:read ]
      tags:
        - agent
      description: Get the active immutable configuration. The first read creates and activates a default version if none exists.
      operationId: getAgentConfiguration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfiguration"
        "404":
          description: Not found
        "400":
          description: Duplicate MCP tool rules (DUPLICATE_AGENT_TOOL_RULE) or invalid configuration dependencies (INVALID_AGENT_CONFIGURATION_DEPENDENCIES)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailResponse"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://oauth.simple.api/token
          scopes:
            ocx-ai:read: Grants read access
  schemas:
    ChatRequest:
      type: object
      required:
        - chatMessage
      properties:
        requestContext:
          $ref: "#/components/schemas/RequestContext"
        chatMessage:
          $ref: "#/components/schemas/ChatMessage"
        conversation:
          $ref: "#/components/schemas/Conversation"
    RequestContext:
      type: object
      properties:
        filter:
          $ref: "#/components/schemas/AgentFilter"
        agentId:
          type: string
        aiContext:
          type: array
          items:
            type: string
    AgentFilter:
      type: object
      properties:
        key:
          type: string
          enum:
            - APP_ID
        value:
          type: string
    ChatMessage:
      type: object
      properties:
        conversationId:
          type: string
        message:
          type: string
          maxLength: 10000
        type:
          type: string
          enum: [ ASSISTANT, SYSTEM, USER, ACTION ]
        creationDate:
          type: integer
          format: int64
    Conversation:
      type: object
      properties:
        conversationId:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        conversationType:
          type: string
          enum: [ Q_AND_A ]
    AgentAbstract:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        voiceEnabled:
          type: boolean
        languageCode:
          type: string
        filter:
          $ref: "#/components/schemas/AgentFilter"
    AgentSearchCriteria:
      type: object
      properties:
        pageNumber:
          format: int32
          default: 0
          type: integer
        pageSize:
          format: int32
          default: 10
          maximum: 100
          type: integer
    AgentPageResult:
      type: object
      properties:
        totalElements:
          format: int64
          type: integer
        number:
          format: int32
          type: integer
        size:
          format: int32
          type: integer
        totalPages:
          format: int64
          type: integer
        stream:
          type: array
          items:
            $ref: "#/components/schemas/AgentAbstract"
    ProblemDetailResponse:
      type: object
      properties:
        errorCode:
          type: string
        detail:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/ProblemDetailParam"
        invalidParams:
          type: array
          items:
            $ref: "#/components/schemas/ProblemDetailInvalidParam"
    ProblemDetailParam:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    ProblemDetailInvalidParam:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
    AgentConfiguration:
      type: object
      required:
        - schemaVersion
      properties:
        schemaVersion:
          type: string
        context:
          $ref: "#/components/schemas/Context"
        agent:
          $ref: "#/components/schemas/AgentConfigurationAgent"
        voice:
          $ref: "#/components/schemas/VoiceSettings"
        provider:
          $ref: "#/components/schemas/ProviderConfiguration"
        model:
          $ref: "#/components/schemas/ModelConfiguration"
        scaffold:
          $ref: "#/components/schemas/ScaffoldConfiguration"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillConfiguration"
        mcpServers:
          type: array
          items:
            $ref: "#/components/schemas/McpServerConfiguration"
    Context:
      type: object
      properties:
        tenantId:
          type: string
        principal:
          type: string
    AgentConfigurationAgent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    VoiceSettings:
      type: object
      properties:
        voiceEnabled:
          type: boolean
        languageCode:
          type: string
    ProviderConfiguration:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        llmUrl:
          type: string
        authMode:
          type: string
        credentialRef:
          type: string
    ModelConfiguration:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        modelIdentifier:
          type: string
        modelConfig:
          type: string
        communicationMode:
          type: string
    ScaffoldConfiguration:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        systemPrompt:
          type: string
    SkillConfiguration:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        instruction:
          type: string
        position:
          type: integer
          format: int32
        source:
          type: string
          enum: [ TENANT, GLOBAL ]
    McpServerConfiguration:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        url:
          type: string
        credentialRef:
          type: string
        unlistedToolPermission:
          type: string
          enum: [ DENY, ALWAYS_ASK, ALWAYS_ALLOW ]
        unlistedToolPermissionSource:
          type: string
          enum: [ AGENT_TOOL_RULE, TOOL_EXECUTION_POLICY, SYSTEM_DEFAULT ]
        toolRules:
          type: array
          items:
            $ref: "#/components/schemas/ToolRuleConfiguration"
    ToolRuleConfiguration:
      type: object
      properties:
        toolName:
          type: string
        description:
          type: string
        permission:
          type: string
          enum: [ DENY, ALWAYS_ASK, ALWAYS_ALLOW ]
        policySource:
          type: string
          enum: [ AGENT_TOOL_RULE, TOOL_EXECUTION_POLICY, SYSTEM_DEFAULT ]
